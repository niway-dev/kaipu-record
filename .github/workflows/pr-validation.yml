name: PR Validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      # setup-bun does not cache modules; cache bun's global install cache keyed on the
      # lockfile so `bun install` reuses downloads across runs.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bunx oxfmt --check .

      - name: Build packages
        run: bun run build --filter='@kaipu/*'

      - name: Type check
        run: bun run check-types

      - name: Build web app
        working-directory: apps/web-hono
        env:
          VITE_SERVER_URL: https://placeholder.example.com
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: bun run build

      - name: Build backend
        working-directory: apps/server-hono
        run: bun run build

      # kaipu-record (desktop) — turbo's check-types/build filters skip it, and
      # nothing else runs its test suite. Validate it in the SAME job so we reuse
      # the single install above (no duplicate setup). The platform/distribution
      # build is its own next task (#7 — needs the Apple Developer account).
      - name: Type check desktop app
        working-directory: apps/kaipu-record
        run: bun run typecheck

      - name: Test desktop app
        working-directory: apps/kaipu-record
        run: bun run test

name: PR Validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bunx oxfmt --check .

      - name: Build packages
        run: bun run build --filter='@kaipu/*'

      - name: Type check
        run: bun run check-types

      - name: Build app
        working-directory: apps/web-hono
        env:
          VITE_SERVER_URL: https://placeholder.example.com
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: placeholder-secret-for-build-validation
        run: bun run build

      - name: Build backend
        working-directory: apps/server-hono
        run: bun run build

  desktop:
    name: Validate desktop app (kaipu-record)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # kaipu-record's own checks — not covered by the `validate` job above
      # (turbo's `check-types`/`build` filters skip it, and nothing runs its tests).
      - name: Type check
        working-directory: apps/kaipu-record
        run: bun run typecheck

      - name: Test
        working-directory: apps/kaipu-record
        run: bun run test

      # Bundle main + preload + renderer (electron-vite). Verifies imports/assets
      # compile and the three process targets build. Calls electron-vite directly
      # to avoid re-running the typecheck the previous step already did.
      # (Full signed/notarized packaging is #7 — needs the Apple Developer account.)
      - name: Build (electron-vite bundle)
        working-directory: apps/kaipu-record
        run: bunx electron-vite build

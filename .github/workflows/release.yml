name: Release (desktop)

# Builds the macOS desktop app (arm64 + x64), signs with Developer ID and
# notarizes it, then attaches the DMGs to a GitHub Release.
#
# Trigger: push a version tag (e.g. `v1.0.1`), or run manually from the
# Actions tab while tuning the pipeline.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MAC_CSC_LINK_BASE64   base64 of the Developer ID .p12 (CSC_LINK accepts base64 directly)
#   MAC_CSC_KEY_PASSWORD  password set when the .p12 was exported
#   APPLE_API_KEY_BASE64  base64 of the App Store Connect .p8 (decoded to a temp file below)
#   APPLE_API_KEY_ID      the key id (10 chars) — e.g. QWXC4HC43K
#   APPLE_API_ISSUER      the Issuer ID (UUID)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  release-mac:
    name: Build, sign & notarize (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Apple API key file
        # @electron/notarize wants the .p8 as a file path, so decode it to the
        # runner's temp dir and expose the path to later steps.
        run: |
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"

      - name: Build, sign & notarize
        working-directory: apps/kaipu-record
        env:
          # electron-builder reads these from the environment. CSC_LINK accepts a
          # base64-encoded .p12 directly; APPLE_API_KEY (path) comes from GITHUB_ENV.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bun run build
          bunx electron-builder --mac --arm64 --x64 --publish never

      - name: Upload artifacts to GitHub Release
        # Only on tag pushes — a manual dispatch has no tag to release against,
        # so it just exercises the build/sign/notarize path.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Draft so a human reviews/writes notes before it reaches testers.
          # Flip to `draft: false` once the pipeline is trusted.
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            apps/kaipu-record/dist/*.dmg
            apps/kaipu-record/dist/*.zip
            apps/kaipu-record/dist/*.blockmap
            apps/kaipu-record/dist/latest-mac*.yml

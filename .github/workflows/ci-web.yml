name: Web Tests

# The web project's tests, on demand. Runs `apps/web-hono`'s `test` script when it
# exists (web has none yet — the step no-ops with a note until one is added, so this
# workflow is wired and ready). Lint / build / type-check lives in the universal `CI`
# workflow.

# Trigger (ADR 0004, /architecture/decisions/0004-local-first-release-verification):
# no longer runs on pull_request. The Lefthook pre-push runs `bun run verify` locally and
# every release-*.yml runs the same command on the tagged SHA before publishing. This
# workflow stays for validating a candidate on demand from the Actions tab. In
# September 2026 its PR-time runs were part of the 802 Linux minutes that exhausted the
# account's quota and blocked releases.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Turbo's local cache. Without it every run re-does `check-types` and `build` from
      # scratch: measured on #161's run, type-check alone was 1m05 and the builds 55s —
      # 71% of the job — while the same tasks replay in seconds locally off a warm cache.
      # Key per SHA, restore from the most recent run's cache (turbo validates each task's
      # own input hash, so a stale entry is skipped, never wrongly reused).
      - name: Cache turbo outputs
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # web depends on many @kaipu/* packages, so build them before testing — but only
      # when there is actually a test script to run (no wasted work until tests exist).
      - name: Run web tests (if present)
        working-directory: apps/web-hono
        run: |
          if [ "$(node -p "require('./package.json').scripts?.test ? 1 : 0")" != "1" ]; then
            echo "No 'test' script in apps/web-hono yet — add one to enable web tests (this workflow is already wired)."
            exit 0
          fi
          (cd "$GITHUB_WORKSPACE" && bun run build --filter='@kaipu/*')
          bun run test

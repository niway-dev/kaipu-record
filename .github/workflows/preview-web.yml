name: Preview Web

# Uploads what is currently on a branch as a Cloudflare Worker VERSION and prints
# its URL. The version is uploaded, never deployed: production traffic keeps going
# to whatever `release-web.yml` last deployed, so running this cannot change what
# visitors see.
#
# This is the "let me look at it on real infrastructure before I tag it" step. It
# is what Cloudflare documents Version URLs for — inspecting one uploaded version
# before promoting it — and it is the only way to measure the site the way a
# visitor gets it: real edge, real brotli, real TTFB. A local `vite preview`
# sends no compression at all, which makes every byte count on localhost about
# three times the real one.
#
# Deliberately manual. It is a looking glass, not a gate: nothing forces you to
# run it before cutting a tag. If it ever needs to BLOCK a bad release rather
# than reveal one, it has to become a required step, not a button.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to upload (defaults to main)"
        required: false
        default: main
      message:
        description: "Label shown beside the version in the Cloudflare dashboard"
        required: false
        default: "manual preview"

# Serialized with itself, but NOT with Release Web: uploading a version and
# deploying one are different operations and must not cancel each other.
concurrency:
  group: preview-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    name: Upload a version and print its URL
    runs-on: ubuntu-latest
    # Same environment as the release job: the upload needs the same Cloudflare
    # credentials and the same build-time values, or the version is not a
    # faithful picture of what a release would produce.
    environment: production

    steps:
      - name: Checkout the requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages only
        run: bun run build --filter='@kaipu/*'

      # Identical to the release job's build. A preview built differently would
      # measure something that is never shipped.
      - name: Build app
        working-directory: apps/web-hono
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VITE_PUBLIC_DOWNLOAD_URL: https://updates.kaipu.app
        run: bun run build

      - name: Upload version to Cloudflare
        id: upload
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web-hono
          # `versions upload` stages the code without routing traffic to it.
          # `deploy` is what release-web.yml runs; the two must stay distinct.
          command: versions upload --message "${{ inputs.message }}"
        env:
          ENVIRONMENT: production
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # The URL is in the action's output; surfacing it in the run summary means
      # you do not have to open the Cloudflare dashboard to find it.
      - name: Report the preview URL
        env:
          OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          URL=$(printf '%s' "$OUTPUT" | grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' | head -1)
          {
            echo "## Web preview"
            echo
            echo "- **ref:** \`${{ inputs.ref }}\`"
            echo "- **commit:** \`${{ github.sha }}\`"
            if [ -n "$URL" ]; then
              echo "- **URL:** $URL"
              echo
              echo "Measure it the way the baseline says to:"
              echo
              echo '```sh'
              echo "bunx lighthouse $URL --preset=desktop --output=html --output-path=./lh-desktop"
              echo "bunx lighthouse $URL --output=html --output-path=./lh-mobile"
              echo '```'
              echo
              echo "Then append a row to \`frontend/web-vitals-baseline\`. This run is served"
              echo "by Cloudflare, so unlike the local baseline it has brotli and a real edge."
            else
              echo "- **URL:** not found in the command output — open the Cloudflare dashboard"
              echo "  under Workers → kaipu-web → Versions."
            fi
            echo
            echo "Production is untouched: this uploaded a version, it did not deploy one."
          } >> "$GITHUB_STEP_SUMMARY"

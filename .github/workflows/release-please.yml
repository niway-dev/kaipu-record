name: release-please

# Maintains one rolling "release PR" per app (desktop / web / api). Merging a
# release PR bumps that app's package.json, writes its CHANGELOG, creates the
# component-prefixed tag (desktop-v* / web-v* / api-v*) and a GitHub Release —
# which in turn triggers the existing release-desktop / release-web / release-api
# workflows. See specs/release-automation-release-please for the full design.
#
# Token note: the tag MUST be created by a non-default token, otherwise the
# `on: push: tags` workflows won't fire (GitHub suppresses events raised by the
# default GITHUB_TOKEN). RELEASE_PLEASE_TOKEN is a fine-grained PAT with
# Contents + Pull requests read/write.

# Cost note (2026-09-24): every push to main used to start this job, including
# docs-only merges. Each run takes 45-96 s but bills a full minute, so September's
# 88 runs cost 90 Linux minutes — about 11% of this repo's Actions usage — and the
# account's quota exhaustion on 2026-09-23 blocked the release PRs themselves.
# Skipping a run is safe: release-please reads the whole history on every run, so
# the next matching push picks up any commits a skipped run did not see. Merging a
# release PR always touches the app's package.json, so the tag is never skipped.
# See /specs/2026-09-23-ci-minutes-audit and /specs/2026-09-ci-usage-baseline.

on:
  push:
    branches:
      - main
    paths:
      - "apps/kaipu-record/**"
      - "apps/web-hono/**"
      - "apps/server-hono/**"
      - "packages/**"
      - "bun.lock"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".github/workflows/release-please.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # RELEASE_PLEASE_TOKEN lives in the `production` environment (where this repo
    # keeps all its secrets). A job only sees an environment's secrets when it
    # declares that environment. `production` has no protection rules, so this
    # does not gate or pause the run.
    environment: production
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

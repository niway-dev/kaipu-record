name: Release API

# Deploys the backend API to its Cloudflare Worker.
# Trigger: push an `api-v*` tag (e.g. `api-v1.2.0`) so the api versions
# independently from desktop and web.

on:
  push:
    tags:
      - "api-v*.*.*"
  workflow_dispatch:

# A release run is never cancelled by another one: it queues behind it. With
# `cancel-in-progress: true`, a manual dispatch started while a tag's run was in flight
# cancelled that run, and then was cancelled in turn — two runs for web-v0.9.1 on
# 2026-10-06, zero deploys. Cancelling a deploy half-way is also the one thing a deploy
# workflow must never do to itself. The group still serialises runs, so two deploys never
# write to the same Worker at once; the later one simply waits.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Release gate (ADR 0004): the same `bun run verify` the Lefthook pre-push runs, on the
  # exact SHA being released, in a clean Linux environment. Nothing below starts until it
  # passes, so a red gate publishes nothing. If it fails after the tag exists, fix forward
  # and cut a patch release; do not delete tags.
  verify:
    name: Verify (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Turbo's local cache. Without it every run re-does `check-types` and `build` from
      # scratch: measured on #161's run, type-check alone was 1m05 and the builds 55s —
      # 71% of the job — while the same tasks replay in seconds locally off a warm cache.
      # Keyed on the lockfile + turbo config, NOT on the SHA: cache entries are immutable,
      # so a per-SHA key mints a fresh entry on every push of an open PR (x9 jobs) and
      # eats the repository's 10 GB budget. Turbo validates each task's own input hash, so
      # an entry that predates the current code is partially reused, never wrongly reused.
      - name: Cache turbo outputs
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

  release-api:
    name: Release API
    needs: verify
    runs-on: ubuntu-latest
    environment: production # Cloudflare + runtime secrets live here

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pinned for the same reasons as release-web.yml: a tag must deploy with the same
      # tools every time it runs, and `deploy --secrets-file` needs this version.
      - name: Install Wrangler
        run: bun add -g wrangler@4.148.0

      - name: Build packages only
        run: bun run build --filter='@kaipu/*'

      # Secrets ship inside the deployed version, in one `wrangler deploy` — see the
      # note in release-web.yml for why the action's `secrets:` input is not used:
      # it deploys the old code with the new secrets first, and it fails outright
      # once a version has been uploaded without being deployed.
      # `--secrets-file` is additive: a secret left out of the file keeps its value.
      # Empty values are dropped for that reason: a GitHub secret that went missing must
      # not blank the value the Worker already has.
      - name: Write Worker secrets file
        working-directory: apps/server-hono
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          # Cloud recordings storage: the private bucket (kaipu-private-bucket), never the
          # public releases bucket. The API reports "not configured" if any of these is empty.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Transactional email (Resend). The API logs and skips sending when unset.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          umask 077
          jq -n \
            --arg DATABASE_URL "$DATABASE_URL" \
            --arg CORS_ORIGIN "$CORS_ORIGIN" \
            --arg BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET" \
            --arg R2_ACCOUNT_ID "$R2_ACCOUNT_ID" \
            --arg R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID" \
            --arg R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY" \
            --arg R2_BUCKET "$R2_BUCKET" \
            --arg RESEND_API_KEY "$RESEND_API_KEY" \
            '$ARGS.named | with_entries(select(.value != ""))' > worker-secrets.json

      - name: Deploy Backend to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/server-hono
          command: deploy --secrets-file worker-secrets.json

      - name: Remove Worker secrets file
        if: always()
        run: rm -f apps/server-hono/worker-secrets.json

name: Release API

# Deploys the backend API to its Cloudflare Worker.
# Trigger: push an `api-v*` tag (e.g. `api-v1.2.0`) so the api versions
# independently from desktop and web.

on:
  push:
    tags:
      - "api-v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Release gate (ADR 0004): the same `bun run verify` the Lefthook pre-push runs, on the
  # exact SHA being released, in a clean Linux environment. Nothing below starts until it
  # passes, so a red gate publishes nothing. If it fails after the tag exists, fix forward
  # and cut a patch release; do not delete tags.
  verify:
    name: Verify (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Turbo's local cache. Without it every run re-does `check-types` and `build` from
      # scratch: measured on #161's run, type-check alone was 1m05 and the builds 55s —
      # 71% of the job — while the same tasks replay in seconds locally off a warm cache.
      # Key per SHA, restore from the most recent run's cache (turbo validates each task's
      # own input hash, so a stale entry is skipped, never wrongly reused).
      - name: Cache turbo outputs
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

  release-api:
    name: Release API
    needs: verify
    runs-on: ubuntu-latest
    environment: production # Cloudflare + runtime secrets live here

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Wrangler
        run: bun add -g wrangler

      - name: Build packages only
        run: bun run build --filter='@kaipu/*'

      - name: Deploy Backend to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/server-hono
          secrets: |
            DATABASE_URL
            BETTER_AUTH_SECRET
            CORS_ORIGIN
            R2_ACCOUNT_ID
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            R2_BUCKET
            RESEND_API_KEY
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          # Cloud recordings storage: the private bucket (kaipu-private-bucket), never the
          # public releases bucket. The API reports "not configured" if any of these is empty.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Transactional email (Resend). The API logs and skips sending when unset.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

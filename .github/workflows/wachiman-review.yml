name: Wachiman review
# The review runs on a Claude subscription, not an API key: run `claude setup-token` signed in to the
# account whose plan should pay and save the token as the repository secret CLAUDE_CODE_OAUTH_TOKEN
# (ADR 0037 of niway-dev/wachiman). The token lasts a year and shares that plan's usage limits.
# Pinned to an exact release tag, so a new engine release runs here only after this line is edited
# (ADR 0001 of niway-dev/wachiman). Releases never move a tag, but a repository admin could;
# only a full commit SHA is immutable.
# First install: the installing pull request gets only the automatic review. `/wachiman review` works
# from the next pull request, because `issue_comment` runs from the default branch. Automatic
# thread-reply runs (v1.5.0) need a `pull_request_review_comment` trigger, which this caller does not have.
# This repository is public: the reusable workflow skips fork pull requests on purpose (they get no
# secrets), and only the operator's comment starts an on-demand run.
# The review focus for this repository is in `.github/agent-review.md`.
# Sonnet 5.5 high reviews directly; the optional second-pass verifier is disabled.
# Each batch keeps the default cap ($0.75). One review may spend $5 instead of the default $3: a
# 58-file pull request (#616) split into 7 batches ran out at $3 and left 11 files unreviewed. All
# automatic runs on one pull request share $8 (default $6), so a push after a $5 first review still
# has $3 for its incremental review (`auto_budget_usd`, v1.5.0). On a subscription those dollars are an
# estimate at API prices, not a charge.
# When the subscription refuses the call (a usage limit, a rejected token, a persistent rate limit),
# the pull request gets a "Not reviewed" notice and the check passes (`on_provider_unavailable: warn`,
# the default since v1.6.0); set it to `fail` to fail the check instead. Nothing falls back to an API key.
on:
  # `synchronize`: every push to a ready pull request gets an incremental review of what changed
  # since the last reviewed commit (ADR 0028, amendment of 2026-11-01).
  pull_request: { types: [opened, ready_for_review, synchronize] }
  issue_comment: { types: [created] }
permissions: { contents: read, pull-requests: write, issues: read }
jobs:
  review:
    uses: niway-dev/wachiman/.github/workflows/review.yml@2dd954858c8c0e6fdb61185ec797f38cf7568bf4 # v1.13.0
    with:
      operator: csdev19
      model: claude-sonnet-5-5
      effort: high
      verify: false
      budget_usd: 5
      auto_budget_usd: 8
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

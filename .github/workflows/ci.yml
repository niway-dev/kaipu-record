name: CI

# Universal fast check on every PR: does everything still lint, format, build and
# type-check? No app-level test suites here — those live in the per-project test
# workflows (ci-desktop / ci-web / ci-api), path-filtered so a project's (slow) suite
# only runs when that project changes. Skips docs-only PRs and release-please chore
# PRs. (Exceptions, both fast build-integrity checks: the design-tokens drift guard,
# and the `@kaipu/*` package unit tests below — small, dependency-free suites for
# domain/application/infra packages that every PR touching them should catch.)

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "apps/documentation/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build & type-check
    runs-on: ubuntu-latest
    # release-please PRs only bump version + CHANGELOG of already-validated code.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      # setup-bun does not cache modules; cache bun's global install cache keyed on the
      # lockfile so `bun install` reuses downloads across runs.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bunx oxfmt --check .

      - name: Build packages
        run: bun run build --filter='@kaipu/*'

      - name: Design-tokens drift check
        working-directory: packages/tokens
        run: bun run test

      - name: Type check
        run: bun run check-types

      - name: Test packages
        run: bun run test --filter='@kaipu/*'

      - name: Build web app
        working-directory: apps/web-hono
        env:
          VITE_SERVER_URL: https://placeholder.example.com
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: bun run build

      - name: Build backend
        working-directory: apps/server-hono
        run: bun run build

      - name: Type check desktop app
        working-directory: apps/kaipu-record
        run: bun run typecheck

name: CI

# Universal check, on demand: does everything still lint, format, build and
# type-check? No app-level test suites here — those live in the per-project test
# workflows (ci-desktop / ci-web / ci-api), path-filtered so a project's (slow) suite
# only runs when that project changes. (Exceptions, both fast build-integrity checks: the design-tokens drift guard,
# and the `@kaipu/*` package unit tests below — small, dependency-free suites for
# domain/application/infra packages that every PR touching them should catch.)

# Trigger (ADR 0004, /architecture/decisions/0004-local-first-release-verification):
# no longer runs on pull_request. The Lefthook pre-push runs `bun run verify` locally and
# every release-*.yml runs the same command on the tagged SHA before publishing. This
# workflow stays for validating a candidate on demand from the Actions tab. In
# September 2026 its PR-time runs were part of the 802 Linux minutes that exhausted the
# account's quota and blocked releases.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build & type-check
    runs-on: ubuntu-latest
    # release-please PRs only bump version + CHANGELOG of already-validated code.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      # setup-bun does not cache modules; cache bun's global install cache keyed on the
      # lockfile so `bun install` reuses downloads across runs.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bunx oxfmt --check .

      - name: Build packages
        run: bun run build --filter='@kaipu/*'

      - name: Design-tokens drift check
        working-directory: packages/tokens
        run: bun run test

      # Covers every workspace, apps included: each one exposes `check-types`, so
      # this single task is the whole type-checking net. It used to skip both apps
      # — the desktop named its task `typecheck`, and the web app had none at all,
      # which meant its TypeScript was never checked anywhere in CI.
      - name: Type check
        run: bun run check-types

      - name: Test packages
        run: bun run test --filter='@kaipu/*'

      - name: Build web app
        working-directory: apps/web-hono
        env:
          VITE_SERVER_URL: https://placeholder.example.com
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: bun run build

      - name: Build backend
        working-directory: apps/server-hono
        run: bun run build

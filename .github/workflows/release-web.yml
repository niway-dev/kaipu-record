name: Release Web

# Deploys the web app (landing + proxy) to its Cloudflare Worker.
# Trigger: push a `web-v*` tag (e.g. `web-v1.2.0`) so the web versions
# independently from desktop and api.

on:
  push:
    tags:
      - "web-v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Release gate (ADR 0004): the same `bun run verify` the Lefthook pre-push runs, on the
  # exact SHA being released, in a clean Linux environment. Nothing below starts until it
  # passes, so a red gate publishes nothing. If it fails after the tag exists, fix forward
  # and cut a patch release; do not delete tags.
  verify:
    name: Verify (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

  release-web:
    name: Build & deploy web
    needs: verify
    runs-on: ubuntu-latest
    environment: production # Cloudflare + build secrets live here

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Wrangler
        run: bun add -g wrangler

      - name: Build packages only
        run: bun run build --filter='@kaipu/*'

      - name: Build app
        working-directory: apps/web-hono
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Public R2 base for the landing's download buttons.
          VITE_PUBLIC_DOWNLOAD_URL: https://updates.kaipu.app
        run: bun run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web-hono
          secrets: |
            VITE_SERVER_URL
            DATABASE_URL
        env:
          ENVIRONMENT: production
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

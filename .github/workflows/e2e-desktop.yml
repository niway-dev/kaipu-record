name: E2E Desktop

on:
  pull_request:
    branches:
      - main
    # Desktop-only, expensive suite (Electron + xvfb). Only run it when something that can
    # affect the desktop build/tests changes. kaipu-record has no workspace-package deps, so
    # its own tree + the workflow + the lockfile fully cover it. (For pull_request, GitHub
    # evaluates this against the PR's whole diff, so it still runs on every push to a PR that
    # touches these paths.)
    paths:
      - "apps/kaipu-record/**"
      - ".github/workflows/e2e-desktop.yml"
      - "bun.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (kaipu-record)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      # setup-bun does not cache modules; cache bun's global install cache keyed on the
      # lockfile so `bun install` reuses downloads across runs.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ffprobe (from ffmpeg) validates the exported MP4's streams; the export test
      # requires it in CI (locally it is optional and the assertion self-skips).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Electron's renderer is Chromium; it needs the same system libraries Playwright's
      # Chromium does. install-deps pulls them (libnss3, libgbm, etc.). No browser download
      # is needed — the tests launch the app's own electron binary.
      - name: Install Electron/Chromium system libraries
        working-directory: apps/kaipu-record
        run: bunx playwright install-deps chromium

      # xvfb-run gives Electron a virtual X display so the window can open headless.
      - name: Run E2E suite
        working-directory: apps/kaipu-record
        run: xvfb-run --auto-servernum bun run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/kaipu-record/playwright-report
            apps/kaipu-record/test-results
          retention-days: 7
          if-no-files-found: ignore

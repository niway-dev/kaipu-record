name: Desktop Tests

# The desktop project's tests (unit + E2E) on Linux, on demand. Lint / build /
# type-check for all projects lives in the universal `CI` workflow.

# Trigger (ADR 0004, /architecture/decisions/0004-local-first-release-verification):
# no longer runs on pull_request. The Lefthook pre-push runs `bun run verify` locally and
# every release-*.yml runs the same command on the tagged SHA before publishing. This
# workflow stays for validating a candidate on demand from the Actions tab. In
# September 2026 its PR-time runs were part of the 802 Linux minutes that exhausted the
# account's quota and blocked releases.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # kaipu-record's workspace deps (@kaipu/i18n, @kaipu/tokens) resolve from
      # source (tsdown devExports) + committed CSS — no package build needed.
      - name: Run unit tests
        working-directory: apps/kaipu-record
        run: bun run test

  e2e:
    name: E2E (kaipu-record)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ffprobe (from ffmpeg) validates the exported MP4's streams; the export test
      # requires it in CI (locally it is optional and the assertion self-skips).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Electron's renderer is Chromium; it needs the same system libraries Playwright's
      # Chromium does. install-deps pulls them (libnss3, libgbm, etc.). No browser download
      # is needed — the tests launch the app's own electron binary.
      - name: Install Electron/Chromium system libraries
        working-directory: apps/kaipu-record
        run: bunx playwright install-deps chromium

      # xvfb-run gives Electron a virtual X display so the window can open headless.
      - name: Run E2E suite
        working-directory: apps/kaipu-record
        # The main process refuses to start without a server URL (src/main/index.ts),
        # and electron-vite inlines it at build time — which happens inside this step.
        # There is no .env in CI, so without this every test times out waiting for a
        # window that never opens. The value only satisfies the startup guard: no
        # server runs here, and the auth specs self-skip on their own health check.
        env:
          MAIN_VITE_SERVER_URL: http://localhost:3000
        run: xvfb-run --auto-servernum bun run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/kaipu-record/playwright-report
            apps/kaipu-record/test-results
          retention-days: 7
          if-no-files-found: ignore

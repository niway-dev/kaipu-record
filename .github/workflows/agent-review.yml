name: Agent review
# Get the key at https://console.anthropic.com and save it as the repository secret ANTHROPIC_API_KEY.
# Pinned to an exact release tag, so a new engine release runs here only after this line is edited
# (ADR 0001 of niway-dev/wachiman). Releases never move a tag, but a repository admin could;
# only a full commit SHA is immutable.
# First install: the installing pull request gets only the automatic review. `/wachi review`
# and thread replies work from the next pull request, because `issue_comment` runs from the default branch.
# This repository is public: the reusable workflow skips fork pull requests on purpose (they get no
# secrets), and only the operator's comment starts an on-demand run.
# The review focus for this repository is in `.github/agent-review.md`.
# Opus 5.5 instead of the Sonnet 5.5 default: about twice the per-token price for a deeper review.
# The default caps still bound each run ($0.75 per batch, $3 per review).
on:
  pull_request: { types: [opened, ready_for_review] }
  issue_comment: { types: [created] }
permissions: { contents: read, pull-requests: write, issues: read }
jobs:
  review:
    uses: niway-dev/wachiman/.github/workflows/review.yml@v1.2.1
    with:
      operator: csdev19
      model: claude-opus-5-5
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

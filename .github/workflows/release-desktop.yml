name: Release Desktop

# Builds the macOS desktop app (arm64 + x64), signs with Developer ID and
# notarizes it, then attaches the DMGs to a GitHub Release.
#
# Trigger: push a `desktop-v*` tag (e.g. `desktop-v0.1.0`), or run manually from
# the Actions tab while tuning the pipeline.
#
# Secrets live in the `production` GitHub Environment (hence `environment:` below):
#   CSC_LINK          base64 of the Developer ID .p12 (electron-builder accepts base64)
#   CSC_KEY_PASSWORD  password set when the .p12 was exported
#   APPLE_API_KEY     base64 of the App Store Connect .p8 (decoded to a temp file below)
#   APPLE_API_KEY_ID  the key id (10 chars) — e.g. QWXC4HC43K
#   APPLE_API_ISSUER  the Issuer ID (UUID)
#
# NOTE: CSC_LINK and APPLE_API_KEY must hold the *base64 of the files*, NOT the
# local file paths from .env.signing — those paths don't exist on the runner.

on:
  push:
    tags:
      # Component-prefixed tags so desktop/web/api version independently.
      - "desktop-v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  release-mac:
    name: Build, sign & notarize (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    environment: production # the signing secrets live in this Environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Apple API key file
        # @electron/notarize wants the .p8 as a file path, so materialize it to the
        # runner's temp dir and expose the path to later steps. Accept either the
        # raw .p8 contents or its base64 (whichever was stored in the secret).
        env:
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
          if printf '%s' "$APPLE_API_KEY_SECRET" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$APPLE_API_KEY_SECRET" > "$KEY_PATH"
          else
            printf '%s' "$APPLE_API_KEY_SECRET" | base64 --decode > "$KEY_PATH"
          fi
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign & notarize
        working-directory: apps/kaipu-record
        env:
          # electron-builder reads these from the environment. CSC_LINK accepts a
          # base64-encoded .p12 directly; APPLE_API_KEY (path) comes from GITHUB_ENV.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bun run build
          bunx electron-builder --mac --arm64 --x64 --publish never

      - name: Publish update feed + installers to R2
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/kaipu-record
        env:
          # R2's S3 API needs its own Access Key + Secret (created in R2 → Manage
          # R2 API Tokens) — the Cloudflare API token does NOT work here. The
          # account id is the same one used everywhere, so reuse CLOUDFLARE_ACCOUNT_ID.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Bucket name is not sensitive — keep it as a plain constant, not a secret.
          R2_BUCKET: kaipu-bucket
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Derive from package.json (same source electron-builder names the dmg from),
          # so a tag/package version drift can never point at a nonexistent file.
          VERSION="$(node -p "require('./package.json').version")"
          # Update feed (zip + blockmap + latest-mac.yml) -> updates/
          aws s3 cp dist/ "s3://${R2_BUCKET}/updates/" --recursive \
            --exclude "*" --include "*-mac.zip" --include "*-mac.zip.blockmap" --include "latest-mac.yml" \
            --endpoint-url "$ENDPOINT"
          # Installers -> download/<version>/ and download/latest/
          for arch in arm64 x64; do
            SRC="dist/kaipu-record-${VERSION}-${arch}.dmg"
            aws s3 cp "$SRC" "s3://${R2_BUCKET}/download/${VERSION}/kaipu-${arch}.dmg" --endpoint-url "$ENDPOINT"
            aws s3 cp "$SRC" "s3://${R2_BUCKET}/download/latest/kaipu-${arch}.dmg" --endpoint-url "$ENDPOINT"
          done

      - name: Prune old release artifacts (keep last N versions)
        # download/<version>/ and updates/ accumulate one entry per release forever
        # otherwise (only download/latest/ self-overwrites). Auto-update only ever
        # needs the newest version's feed entry; older ones just enable manual
        # rollback, so we only need to keep a handful of them around.
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/kaipu-record
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: kaipu-bucket
          KEEP_VERSIONS: 3
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # List the version folders under download/ (excludes download/latest/,
          # which isn't a version), oldest first.
          VERSIONS=$(aws s3 ls "s3://${R2_BUCKET}/download/" --endpoint-url "$ENDPOINT" \
            | awk '{print $2}' | sed 's#/$##' | grep -v '^latest$' | grep -v '^$' | sort -V || true)
          TOTAL=0
          if [ -n "$VERSIONS" ]; then
            TOTAL=$(echo "$VERSIONS" | wc -l | tr -d ' ')
          fi
          STALE=$((TOTAL - KEEP_VERSIONS))
          if [ "$STALE" -gt 0 ]; then
            echo "$VERSIONS" | head -n "$STALE" | while read -r v; do
              [ -z "$v" ] && continue
              echo "Pruning release artifacts for v${v} (keeping last ${KEEP_VERSIONS} versions)"
              aws s3 rm "s3://${R2_BUCKET}/download/${v}/" --recursive --endpoint-url "$ENDPOINT"
              # Version-scoped update-feed files only (zip + blockmap for both archs).
              # latest-mac.yml has no version segment in its name, so it's never matched here.
              aws s3 rm "s3://${R2_BUCKET}/updates/" --recursive --endpoint-url "$ENDPOINT" \
                --exclude "*" --include "*-${v}-*"
            done
          else
            echo "${TOTAL} version(s) published, nothing to prune (keeping last ${KEEP_VERSIONS})."
          fi

      - name: Upload build as workflow artifact
        # Only for manual-dispatch runs (no tag): a tag release already ships the
        # DMG/zip to R2 and to the GitHub Release, so the workflow artifact would
        # be a redundant ~500 MB copy that counts against the Actions storage
        # quota. Manual runs have neither, so keep a short-lived artifact for them.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: kaipu-record-macos
          path: |
            apps/kaipu-record/dist/*.dmg
            apps/kaipu-record/dist/*.zip
          if-no-files-found: error
          retention-days: 3

      - name: Upload artifacts to GitHub Release
        # Only on tag pushes — a manual dispatch has no tag to release against,
        # so it just exercises the build/sign/notarize path.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Draft so a human reviews/writes notes before it reaches testers.
          # Flip to `draft: false` once the pipeline is trusted.
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            apps/kaipu-record/dist/*.dmg
            apps/kaipu-record/dist/*.zip
            apps/kaipu-record/dist/*.blockmap
            apps/kaipu-record/dist/latest-mac*.yml

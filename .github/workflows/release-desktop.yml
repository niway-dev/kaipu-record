name: Release Desktop

# Builds the macOS desktop app (arm64 + x64), signs with Developer ID and
# notarizes it, then attaches the DMGs to a GitHub Release.
#
# Trigger: push a `desktop-v*` tag (e.g. `desktop-v0.1.0`), or run manually from
# the Actions tab while tuning the pipeline.
#
# Release gate (ADR 0004, /architecture/decisions/0004-local-first-release-verification):
# a Linux `verify` job (lint, types, unit tests) must pass on this exact SHA, then the
# macOS job builds, runs the Playwright E2E against that build, and only then signs,
# notarizes and writes the update feed to R2. PR-time cloud checks were retired; this
# is where the cloud validates the code that ships.
#
# Secrets live in the `production` GitHub Environment (hence `environment:` below):
#   CSC_LINK          base64 of the Developer ID .p12 (electron-builder accepts base64)
#   CSC_KEY_PASSWORD  password set when the .p12 was exported
#   APPLE_API_KEY     base64 of the App Store Connect .p8 (decoded to a temp file below)
#   APPLE_API_KEY_ID  the key id (10 chars) — e.g. QWXC4HC43K
#   APPLE_API_ISSUER  the Issuer ID (UUID)
#
# NOTE: CSC_LINK and APPLE_API_KEY must hold the *base64 of the files*, NOT the
# local file paths from .env.signing — those paths don't exist on the runner.

on:
  push:
    tags:
      # Component-prefixed tags so desktop/web/api version independently.
      - "desktop-v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  # Release gate (ADR 0004): the same `bun run verify` the Lefthook pre-push runs, on the
  # exact SHA being released, in a clean Linux environment. Nothing below starts until it
  # passes, so a red gate publishes nothing. If it fails after the tag exists, fix forward
  # and cut a patch release; do not delete tags.
  verify:
    name: Verify (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

  release-mac:
    name: Build, sign & notarize (macOS)
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    environment: production # the signing secrets live in this Environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Rebuilds uiohook-napi against Electron's ABI. This was a postinstall until it
      # was made explicit (scripts/rebuild-native.sh). It MUST stay here: this is a
      # macOS runner and `electron-builder.yml` sets `npmRebuild: false`, so without
      # it the signed artifact ships a module built for the wrong ABI — a failure
      # that surfaces on a user's machine, not in this job.
      - name: Rebuild native dependencies for Electron
        run: bash scripts/rebuild-native.sh

      - name: Prepare Apple API key file
        # @electron/notarize wants the .p8 as a file path, so materialize it to the
        # runner's temp dir and expose the path to later steps. Accept either the
        # raw .p8 contents or its base64 (whichever was stored in the secret).
        env:
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
          if printf '%s' "$APPLE_API_KEY_SECRET" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$APPLE_API_KEY_SECRET" > "$KEY_PATH"
          else
            printf '%s' "$APPLE_API_KEY_SECRET" | base64 --decode > "$KEY_PATH"
          fi
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build
        working-directory: apps/kaipu-record
        env:
          # The auth server the shipped app talks to. electron-vite INLINES this into
          # the main bundle at build time, so it is frozen into every signed binary —
          # deliberately its own variable rather than the web's VITE_SERVER_URL, which
          # can be re-pointed by a redeploy that installed desktop apps cannot follow.
          MAIN_VITE_SERVER_URL: ${{ vars.MAIN_VITE_SERVER_URL }}
        run: |
          # Fail here rather than ship: an unset value inlines as `undefined`, and the
          # main process throws on startup (src/main/index.ts), so the app would open
          # no window at all on every user's machine.
          test -n "$MAIN_VITE_SERVER_URL" || {
            echo "::error::MAIN_VITE_SERVER_URL is not set — add it to the production Environment"
            exit 1
          }
          bun run build

      # Release gate, second half (ADR 0004): Playwright drives the build above — the very
      # bundle that gets signed — on the platform users run. This is the only place the
      # export path is exercised in the cloud: on Linux runners it self-skips (no WebCodecs
      # H.264 encoder). `playwright test` is called directly rather than `bun run test:e2e`
      # so the build is not repeated. ffprobe is deliberately NOT installed (`brew install
      # ffmpeg` costs macOS minutes): the export still runs end to end and only the codec
      # assertion is skipped, with a visible annotation. Add the install when quota allows.
      # The auth specs self-skip when no server answers their health check.
      - name: E2E (Playwright, built app)
        working-directory: apps/kaipu-record
        run: bunx playwright test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/kaipu-record/playwright-report
            apps/kaipu-record/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Sign, notarize & package
        working-directory: apps/kaipu-record
        env:
          # electron-builder reads these from the environment. CSC_LINK accepts a
          # base64-encoded .p12 directly; APPLE_API_KEY (path) comes from GITHUB_ENV.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bunx electron-builder --mac --arm64 --x64 --publish never

      - name: Publish update feed + installers to R2
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/kaipu-record
        env:
          # R2's S3 API needs its own Access Key + Secret (created in R2 → Manage
          # R2 API Tokens) — the Cloudflare API token does NOT work here. The
          # account id is the same one used everywhere, so reuse CLOUDFLARE_ACCOUNT_ID.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Bucket name is not sensitive — keep it as a plain constant, not a secret.
          R2_BUCKET: kaipu-bucket
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Derive from package.json (same source electron-builder names the dmg from),
          # so a tag/package version drift can never point at a nonexistent file.
          VERSION="$(node -p "require('./package.json').version")"
          # Update feed (zip + blockmap + latest-mac.yml) -> updates/
          aws s3 cp dist/ "s3://${R2_BUCKET}/updates/" --recursive \
            --exclude "*" --include "*-mac.zip" --include "*-mac.zip.blockmap" --include "latest-mac.yml" \
            --endpoint-url "$ENDPOINT"
          # Installers -> download/<version>/ and download/latest/
          for arch in arm64 x64; do
            SRC="dist/kaipu-record-${VERSION}-${arch}.dmg"
            aws s3 cp "$SRC" "s3://${R2_BUCKET}/download/${VERSION}/kaipu-${arch}.dmg" --endpoint-url "$ENDPOINT"
            aws s3 cp "$SRC" "s3://${R2_BUCKET}/download/latest/kaipu-${arch}.dmg" --endpoint-url "$ENDPOINT"
          done

      - name: Prune old release artifacts (keep last N versions)
        # download/<version>/ and updates/ accumulate one entry per release forever
        # otherwise (only download/latest/ self-overwrites). Auto-update only ever
        # needs the newest version's feed entry; older ones just enable manual
        # rollback, so we only need to keep a handful of them around.
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/kaipu-record
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: kaipu-bucket
          KEEP_VERSIONS: 3
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # List the version folders under download/ (excludes download/latest/,
          # which isn't a version), oldest first.
          VERSIONS=$(aws s3 ls "s3://${R2_BUCKET}/download/" --endpoint-url "$ENDPOINT" \
            | awk '{print $2}' | sed 's#/$##' | grep -v '^latest$' | grep -v '^$' | sort -V || true)
          TOTAL=0
          if [ -n "$VERSIONS" ]; then
            TOTAL=$(echo "$VERSIONS" | wc -l | tr -d ' ')
          fi
          STALE=$((TOTAL - KEEP_VERSIONS))
          if [ "$STALE" -gt 0 ]; then
            echo "$VERSIONS" | head -n "$STALE" | while read -r v; do
              [ -z "$v" ] && continue
              echo "Pruning release artifacts for v${v} (keeping last ${KEEP_VERSIONS} versions)"
              aws s3 rm "s3://${R2_BUCKET}/download/${v}/" --recursive --endpoint-url "$ENDPOINT"
              # Version-scoped update-feed files only (zip + blockmap for both archs).
              # latest-mac.yml has no version segment in its name, so it's never matched here.
              aws s3 rm "s3://${R2_BUCKET}/updates/" --recursive --endpoint-url "$ENDPOINT" \
                --exclude "*" --include "*-${v}-*"
            done
          else
            echo "${TOTAL} version(s) published, nothing to prune (keeping last ${KEEP_VERSIONS})."
          fi

      - name: Upload build as workflow artifact
        # Only for manual-dispatch runs (no tag): a tag release already ships the
        # DMG/zip to R2 and to the GitHub Release, so the workflow artifact would
        # be a redundant ~500 MB copy that counts against the Actions storage
        # quota. Manual runs have neither, so keep a short-lived artifact for them.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: kaipu-record-macos
          path: |
            apps/kaipu-record/dist/*.dmg
            apps/kaipu-record/dist/*.zip
          if-no-files-found: error
          retention-days: 3

      - name: Upload artifacts to GitHub Release
        # Only on tag pushes — a manual dispatch has no tag to release against,
        # so it just exercises the build/sign/notarize path.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Draft so a human reviews/writes notes before it reaches testers.
          # Flip to `draft: false` once the pipeline is trusted.
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            apps/kaipu-record/dist/*.dmg
            apps/kaipu-record/dist/*.zip
            apps/kaipu-record/dist/*.blockmap
            apps/kaipu-record/dist/latest-mac*.yml

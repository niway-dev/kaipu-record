name: PR checks

# Tier: pull-request gate (ADR 0004, /architecture/decisions/0004-local-first-release-verification).
# Reopen when: a second person merges, or release-time verification starts finding
# regressions `verify` missed locally — at that point ordinary PRs need their own cloud
# checks again and this workflow stops being the only pull_request-triggered one.
#
# Two things live here, and they are deliberately different sizes.
#
# 1. `Merge requirements` — the REQUIRED check. It reports on every ordinary pull request,
#    because a required check that never reports leaves the PR perpetually pending and
#    blocks merge forever (the paths-filter gotcha in the hub's pr-checks.md), and on a
#    release candidate it reports exactly once per commit, from the run that verified that
#    commit. Both halves are explained on the job itself. It costs one short job.
# 2. `Run release checks and builds` — the expensive one. It runs `bun run verify` plus the web
#    and API bundles on the release PR that release-please maintains, so `main` is validated
#    as it will be tagged, BEFORE the tag exists. A failure here costs a fix and a push; the
#    same failure in release-*.yml costs a tag, an empty GitHub Release and a patch release.
# 3. `Desktop E2E (macOS, release candidate)` — the expensive one on the expensive runner.
#    Playwright drives the real Electron build on the platform that ships. It used to run
#    ONLY inside release-desktop.yml, i.e. AFTER the tag existed, which is how desktop 0.8.0
#    ended up with a published, empty GitHub Release when it failed on 2026-09-25. Running it
#    here makes that failure cost a push instead of a tag. macOS bills at 10x, so it is gated
#    to DESKTOP candidates: a web or api release PR does not pay for it. See ADR 0006.
#
# READINESS POLICY — draft means "still accumulating", ready means "verify this".
#
# release-please opens its release PRs as drafts (`draft-pull-request` in
# release-please-config.json) and rewrites them on every releasable merge to `main`. While
# the PR is a draft none of those rewrites allocate a verification runner. Marking it
# **Ready for review** is the signal to verify, and from that moment every new revision is
# re-verified, with the superseded run cancelled.
#
# This replaced a `verify` LABEL that did the same job badly: the workflow listened to every
# `labeled`/`unlabeled` event, so release-please's own `autorelease: pending` / `autorelease:
# tagged` bookkeeping started full verifications — including one 13 seconds AFTER the PR had
# merged and the tag already existed (PR #165, runs #13 and #16 on 2026-09-25). Draft state
# is a first-class GitHub concept, it cannot be churned by a bot's label housekeeping, and
# GitHub already refuses to merge a draft.
#
# Eligibility is decided at the JOB level, before a runner is allocated. The old workflow
# checked the label in a *step*, so it booted a full VM just to print an error and exit.

on:
  pull_request:
    branches:
      - main
    # Why each of these, since the default set is not enough and every extra type is a
    # potential wasted run:
    #   ready_for_review  — THE trigger. "This candidate is the one I am publishing."
    #   synchronize       — a new revision. Re-verify it; cancel the superseded run.
    #   converted_to_draft— back to accumulating. Cancel in-flight verification.
    #   opened/reopened   — an ordinary PR needs its required check from the start.
    #   edited            — ONLY for a base change, so a stacked PR retargeted onto `main`
    #                       still gets its required check. GitHub fires `edited` for title
    #                       and body edits too; those are filtered out by
    #                       `github.event.changes.base.ref.from` below, which is populated
    #                       only when the base actually moved. Without `edited`, a PR opened
    #                       against another branch and later retargeted to `main` never
    #                       triggers this workflow, the required check never reports, and
    #                       the PR is unmergeable forever (hit on PR #173, 2026-09-25).
    # `labeled`/`unlabeled` are deliberately ABSENT. See the readiness policy above.
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - edited
  workflow_dispatch:

# NOTE: there is no workflow-level `concurrency` on purpose. With one, an irrelevant event
# (a title edit) starts a run that cancels an in-flight verification *before* the new run's
# job conditions get a chance to skip it — destroying a valid verification to run nothing.
# Cancellation is scoped to the expensive job instead, below, so only runs that actually
# verify can supersede one another.

permissions:
  contents: read

jobs:
  verify:
    name: Run release checks and builds
    runs-on: ubuntu-latest
    # Everything that decides "should this cost a runner?" is here, not in a step.
    #   - an open, non-draft PR                (draft accumulates for free)
    #   - whose head is a release-please branch (ordinary PRs never pay this)
    #   - on an event that changes the candidate, not its prose
    # `workflow_dispatch` bypasses all of it: it is the documented manual escape hatch for
    # the risky-change list in ADR 0004, and `github.head_ref` is empty outside a PR.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.state == 'open' &&
          github.event.pull_request.draft == false &&
          startsWith(github.head_ref, 'release-please--') &&
          (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
        )
      }}
    # Job-level, so only runs that reach this job join the group. A newer revision cancels
    # the verification of the one it replaced; a title edit cannot.
    concurrency:
      group: verify-release-candidate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out candidate code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Restore Bun dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Turbo's local cache. Without it every run re-does `check-types` and `build` from
      # scratch: measured on #161's run, type-check alone was 1m05 and the builds 55s —
      # 71% of the job — while the same tasks replay in seconds locally off a warm cache.
      # Keyed on the lockfile + turbo config, NOT on the SHA: cache entries are immutable,
      # so a per-SHA key mints a fresh entry on every push of an open PR (x9 jobs) and
      # eats the repository's 10 GB budget. Turbo validates each task's own input hash, so
      # an entry that predates the current code is partially reused, never wrongly reused.
      - name: Restore Turbo task cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run lint, formatting, type checks and tests
        run: bun run verify

      # The two app bundles are otherwise built only inside release-web / release-api.
      # Building them here surfaces a bundling failure before the tag, at no extra job.
      - name: Build web app
        working-directory: apps/web-hono
        env:
          VITE_SERVER_URL: https://placeholder.example.com
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: bun run build

      - name: Build API
        working-directory: apps/server-hono
        run: bun run build

  # The desktop release gate, moved in front of the tag (ADR 0006).
  #
  # A faithful copy of the E2E step in release-desktop.yml, native rebuild included, because
  # a candidate that does not exercise what ships is not a candidate. This is the only place
  # the export path runs in the cloud: on Linux runners it self-skips, as headless Chromium
  # has no H.264 encoder.
  #
  # `environment: production` is declared only to read MAIN_VITE_SERVER_URL, which the build
  # inlines into the main bundle. That environment has no protection rules, and no signing
  # secret is used here — signing stays in the release workflow.
  e2e_desktop:
    name: Desktop E2E (macOS, release candidate)
    runs-on: macos-latest
    timeout-minutes: 30
    environment: production
    # Gated to DESKTOP candidates. A web or api release PR is still a release PR, but nothing
    # in it can change what the desktop app does, and a macOS minute costs ten.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.state == 'open' &&
          github.event.pull_request.draft == false &&
          startsWith(github.head_ref, 'release-please--') &&
          contains(github.head_ref, 'components--desktop') &&
          (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
        )
      }}
    concurrency:
      group: e2e-desktop-candidate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same reasoning as release-desktop.yml: `electron-builder.yml` sets
      # `npmRebuild: false`, so uiohook-napi must be rebuilt against Electron's ABI
      # explicitly. Skip it and the app degrades to "no clicks" rather than crashing, which
      # would let this suite pass against something users never run.
      - name: Rebuild native dependencies for Electron
        run: bash scripts/rebuild-native.sh

      - name: Build
        working-directory: apps/kaipu-record
        env:
          MAIN_VITE_SERVER_URL: ${{ vars.MAIN_VITE_SERVER_URL }}
        run: |
          test -n "$MAIN_VITE_SERVER_URL" || {
            echo "::error::MAIN_VITE_SERVER_URL is not set — add it to the production Environment"
            exit 1
          }
          bun run build

      # `playwright test` directly, not `bun run test:e2e`, so the build above is not
      # repeated. ffprobe is deliberately not installed (`brew install ffmpeg` costs macOS
      # minutes): the export still runs end to end and only the codec assertion skips.
      # Invoked through node by path, never `bunx playwright`: a bun runtime loads
      # Playwright's modules twice, every test() registers against an instance the
      # runner never reads, and the run ends "No tests found" — a gate that tests
      # nothing while looking like it ran. See playwright.config.ts.
      - name: E2E (Playwright, built app)
        working-directory: apps/kaipu-record
        run: node node_modules/@playwright/test/cli.js test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-candidate
          path: |
            apps/kaipu-record/playwright-report
            apps/kaipu-record/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Returning a ready candidate to draft means "not this one after all". Joining the verify
  # job's concurrency group from a job that costs seconds cancels the in-flight verification
  # instead of paying out the remaining minutes of a result nobody will read.
  cancel-superseded:
    name: Cancel verification when returned to draft
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event.action == 'converted_to_draft' &&
        startsWith(github.head_ref, 'release-please--')
      }}
    concurrency:
      group: verify-release-candidate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Explain cancellation after returning to draft
        run: |
          echo "Candidate returned to draft; any in-flight verification for this PR is cancelled."
          echo "Mark the pull request ready for review again to verify the current revision."

  # THE REQUIRED CHECK.
  #
  # ONE RULE GOVERNS THIS JOB: a given commit must receive exactly one report of this
  # check, and it must come from the run that actually verified the commit.
  #
  # That rule exists because GitHub resolves a required check across every check run of
  # that name on the head commit by taking the WORST conclusion, not the latest. Measured
  # on this repository on 2026-09-27, on the desktop 0.9.0 candidate (PR #178):
  #
  #   commit 0626081  skipped + success  -> rollup SUCCESS   (skipped is neutral)
  #   commit c78b287  failure + success  -> rollup FAILURE    (mergeable, but BLOCKED)
  #   commit fa01a9b  failure + success  -> rollup FAILURE    (mergeable, but BLOCKED)
  #
  # A commit gets more than one run because release-please force-pushes the branch AND
  # rewrites the body, so `synchronize` and `edited` arrive in the same second and GitHub
  # starts two runs. Returning a candidate to draft and back does the same on one commit.
  #
  # So a run that did not verify must report NOTHING. A previous revision of this workflow
  # made this job unskippable and fail closed, reasoning that a skipped check reads as
  # passed. Half of that was right — skipped IS neutral — but the conclusion was backwards:
  # failing closed in the run that verified nothing left a permanent FAILURE on the commit,
  # and because the rollup takes the worst conclusion, the verified candidate could never
  # merge. That is what blocked desktop 0.9.0 for three revisions in a row.
  #
  # Skipping is safe here for a reason that is worth stating, because it is the whole
  # safety argument: skipped is neutral, so a skip cannot satisfy the requirement on its
  # own — it can only decline to speak. What satisfies it is a real success, and the only
  # job that can produce one is `verify` in this same run. Every non-draft candidate
  # revision gets such a run, because `synchronize` and `ready_for_review` both start one.
  gate:
    name: Merge requirements
    runs-on: ubuntu-latest
    needs: [verify, e2e_desktop]
    # Report iff this run decided. Two halves, and both are load-bearing:
    #
    #   - An ordinary pull request is ALWAYS reported on. Its `verify` never runs, so
    #     without the first clause the required check would never report and every PR in
    #     the repository would be unmergeable (the paths-filter deadlock, hit on #173).
    #   - A release candidate is reported on only when this run's `verify` — and, for a
    #     desktop candidate, its E2E — reached a real conclusion. `skipped` means this run
    #     was the prose-`edited` twin or the PR is a draft; `cancelled` means a newer
    #     revision superseded it. Neither knows anything about the commit, so neither may
    #     speak about it.
    #
    # The conditions are read off `needs.*.result`, never off the event shape. A condition
    # on `draft`, `state` or `changes.base` would make a run that DID verify stay silent,
    # which is the failure mode this job is built to prevent; the regression check in
    # scripts/check-workflow-eligibility.ts enforces that distinction.
    if: >-
      ${{
        always() && github.event_name == 'pull_request' &&
        (
          !startsWith(github.head_ref, 'release-please--') ||
          (
            (needs.verify.result == 'success' || needs.verify.result == 'failure') &&
            (
              !contains(github.head_ref, 'components--desktop') ||
              needs.e2e_desktop.result == 'success' ||
              needs.e2e_desktop.result == 'failure'
            )
          )
        )
      }}
    steps:
      - name: Check whether release verification permits merging
        env:
          IS_RELEASE: ${{ startsWith(github.head_ref, 'release-please--') }}
          IS_DESKTOP: ${{ contains(github.head_ref, 'components--desktop') }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          VERIFY: ${{ needs.verify.result }}
          E2E: ${{ needs.e2e_desktop.result }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$IS_RELEASE" != "true" ]; then
            echo "Not a release candidate. Candidate verification does not apply to this pull request."
            exit 0
          fi

          # Unreachable as the job is currently conditioned: a draft candidate never
          # verifies, so the gate stays silent and this step does not run. It is kept
          # because it fails closed and says why, so loosening the condition above
          # degrades to a clear red rather than to a green on an unverified candidate.
          if [ "$IS_DRAFT" = "true" ]; then
            echo "::error title=Release candidate is still a draft::Mark this pull request ready for review to verify it. Nothing has been verified while it is a draft."
            exit 1
          fi

          case "$VERIFY" in
            success) ;;
            failure)
              echo "::error title=Release candidate failed verification::\`bun run verify\` or an app bundle build failed on $SHA. Fix it and push; the new revision is verified automatically while this PR is ready for review."
              exit 1
              ;;
            cancelled)
              echo "::error title=Release candidate verification cancelled::It was superseded by a newer revision, or this PR was returned to draft. Mark the pull request ready for review again to verify the current revision."
              exit 1
              ;;
            *)
              echo "::error title=Release candidate not verified::Verification did not run for this revision (verify job: $VERIFY). Return the pull request to draft and mark it ready for review again."
              exit 1
              ;;
          esac

          # The desktop E2E only applies to a desktop candidate; a web or api candidate
          # deliberately never starts it, and `skipped` there is the expected result.
          if [ "$IS_DESKTOP" = "true" ]; then
            case "$E2E" in
              success) ;;
              failure)
                echo "::error title=Desktop E2E failed::Playwright failed against the built app on macOS for $SHA. This is the check that used to run only after the tag existed. Fix it and push; the new revision is verified automatically while this PR is ready for review."
                exit 1
                ;;
              cancelled)
                echo "::error title=Desktop E2E cancelled::It was superseded by a newer revision, or this PR was returned to draft. Mark the pull request ready for review again to verify the current revision."
                exit 1
                ;;
              *)
                echo "::error title=Desktop E2E did not run::A desktop release candidate must pass the macOS end-to-end suite before the tag exists (e2e_desktop job: $E2E). Return the pull request to draft and mark it ready for review again."
                exit 1
                ;;
            esac
            echo "Desktop end-to-end suite passed on macOS."
          fi

          echo "Release candidate verified on $SHA."

  # TRANSITIONAL — delete once the `main release` ruleset requires `Merge requirements`.
  #
  # The live ruleset (id 23974690) still requires a check literally named "Release candidate
  # verified". Renaming the gate job without this alias would leave every PR waiting on a
  # check name nothing reports any more, which blocks merge on `main` for everyone. This job
  # reports the old name with the new job's result, so the rename and the ruleset update can
  # happen in either order and neither blocks the other. Migration steps are in ADR 0005.
  legacy-gate:
    name: Release candidate verified
    runs-on: ubuntu-latest
    needs: [gate]
    # Mirror the gate's silence as well as its verdict. This job carries the name the live
    # ruleset requires, so reporting a failure here when `gate` declined to speak would
    # leave the same permanent FAILURE on the commit that the gate's own condition exists
    # to avoid — the rollup takes the worst conclusion across runs. See the gate above.
    if: >-
      ${{
        always() && github.event_name == 'pull_request' &&
        needs.gate.result != 'skipped' && needs.gate.result != 'cancelled'
      }}
    steps:
      - name: Mirror merge requirements for the existing branch rule
        env:
          GATE: ${{ needs.gate.result }}
        run: |
          set -euo pipefail
          echo "Deprecated check name. The decision is made by 'Merge requirements' (result: $GATE)."
          [ "$GATE" = "success" ]

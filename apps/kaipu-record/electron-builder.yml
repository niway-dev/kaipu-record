appId: com.niway.kaipu-record
productName: Kaipu Record
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
win:
  executableName: kaipu-record
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.video # cosmetic (LSApplicationCategoryType)
  hardenedRuntime: true # REQUIRED to notarize
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # electron-builder@26: notarize is a boolean (the older {teamId} object is
  # rejected by the schema). Notarization activates only when the APPLE_API_*
  # env vars are present (see scripts/build-mac-local.sh) — the API key carries
  # the team, so no teamId is needed here. Without the vars the build is signed-only.
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: Kaipu Recorder usa el micrófono para grabar audio.
    NSCameraUsageDescription: Kaipu Recorder usa la cámara para grabar video.
    NSDocumentsFolderUsageDescription: Kaipu Recorder guarda tus grabaciones en la carpeta Documentos.
    NSDownloadsFolderUsageDescription: Kaipu Recorder guarda tus grabaciones en la carpeta Descargas.
dmg:
  # ${arch} is required: arm64 + x64 builds would otherwise collide on one name.
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://updates.kaipu.app/updates/ # R2 public base + /updates/ — replace host with the real R2 domain
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

appId: com.niway.kaipu-record
productName: Kaipu Record
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
# The kaipu:// scheme the browser sign-in returns through. electron-builder writes it into the
# macOS Info.plist (CFBundleURLTypes), the NSIS installer's registry entries and the Linux
# desktop file. Dev builds do not get it (macOS only routes custom schemes to packaged apps);
# they use the paste-code fallback.
protocols:
  - name: Kaipu
    schemes:
      - kaipu
asarUnpack:
  - resources/**
  - "**/node_modules/uiohook-napi/**"
win:
  executableName: kaipu-record
  # Custom signing hook (read at build time, not packaged). No-ops with a CI
  # warning without WIN_SIGN_VENDOR; throws for an unknown or unfinished vendor.
  signtoolOptions:
    sign: ./scripts/sign-windows.cjs
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # The one-click installer's progress banner shows no icon unless given one. Same file
  # as the .exe, installer and uninstaller icon: scripts/generate-app-icons.sh derives it
  # from packages/brand, so it cannot fall behind the logo the app shows.
  installerHeaderIcon: build/icon.ico
  # Shown as the installer's first page: SignPath's signing terms require software that
  # sends data off the device to show its privacy notice during installation. Kept as
  # UTF-8 with BOM, or electron-builder rewrites it in place on every build.
  license: build/installer-privacy-notice.txt
mac:
  category: public.app-category.video # cosmetic (LSApplicationCategoryType)
  hardenedRuntime: true # REQUIRED to notarize
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # electron-builder@26: notarize is a boolean (the older {teamId} object is
  # rejected by the schema). Notarization activates only when the APPLE_API_*
  # env vars are present (see scripts/build-mac-local.sh) — the API key carries
  # the team, so no teamId is needed here. Without the vars the build is signed-only.
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: Kaipu Record usa el micrófono para grabar audio.
    NSCameraUsageDescription: Kaipu Record usa la cámara para grabar video.
    NSDocumentsFolderUsageDescription: Kaipu Record guarda tus grabaciones en la carpeta Documentos.
    NSDownloadsFolderUsageDescription: Kaipu Record guarda tus grabaciones en la carpeta Descargas.
dmg:
  # ${arch} is required: arm64 + x64 builds would otherwise collide on one name.
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://updates.kaipu.app/updates/ # public R2 custom domain — must be bound to the bucket before the first release
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

# Git hooks. Docs: https://lefthook.dev — contract: /specs/2026-09-06-lefthook-migration-design,
# pre-push narrowed by ADR 0010 (/architecture/decisions/0010-checks-run-in-actions-on-every-pr).
# commit = fix what you commit · push = the fast checks only (lint, format, types)
# commit-msg = reject what release-please cannot parse. Bypass once: LEFTHOOK=0 git <cmd>.
#
# Tests, the app bundles and the desktop end-to-end suite run in Actions on every pull
# request (pr-checks.yml), not here. The e2e suite opens the app thirteen times and took
# the screen for half a minute on every push; on a public repository the same run costs
# nothing in the cloud. `bun run verify` still runs the full set locally when you want it.
min_version: 2.0.0

pre-commit:
  jobs:
    - name: format
      glob: "*.{js,jsx,cjs,mjs,ts,tsx,cts,mts,json,jsonc,css,md,mdx}"
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{js,jsx,cjs,mjs,ts,tsx,cts,mts}"
      run: bunx oxlint {staged_files}

commit-msg:
  skip:
    - merge
    - rebase
  jobs:
    - name: conventional-commit
      run: |
        first="$(head -1 {1})"
        echo "$first" | grep -qE '^(fixup!|squash!|Merge |Revert )' && exit 0
        echo "$first" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9._/-]+\))?!?: .+' && exit 0
        echo "Commit message must follow Conventional Commits, e.g. 'feat(web): add recordings page'."
        echo "release-please derives versions and changelogs from these prefixes."
        exit 1

pre-push:
  jobs:
    # Lint, format check, package builds (cached by Turbo) and type checks. No tests and no
    # end-to-end suite — see the header.
    - name: verify-local
      run: bun run verify:local
